<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名刺登録</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #222; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hint { font-size: 13px; color: #666; margin: 6px 0 0; }
  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  button, .pick { display: block; width: 100%; box-sizing: border-box; text-align: center; font-size: 17px; padding: 14px; border: 0; border-radius: 10px; background: #06c755; color: #fff; font-weight: bold; margin-top: 12px; cursor: pointer; }
  button.sub, .pick.sub { background: #e5e7eb; color: #222; }
  button.small { display: inline-block; width: auto; font-size: 14px; padding: 8px 12px; margin: 0; }
  button:disabled { opacity: .5; }
  .pick input { display: none; }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .msg { padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
  .ok { background: #e7f7ee; color: #116b35; }
  .err { background: #fdecec; color: #a12121; }
  #crop, #batch { display: none; }
  #crop { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #canvas { width: 100%; border-radius: 8px; touch-action: none; display: block; margin-top: 8px; background: #ddd; }
  .item { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-top: 12px; }
  .item.done { opacity: .5; }
  .item .head { display: flex; align-items: center; gap: 10px; }
  .item .head img { width: 45%; border-radius: 6px; }
  .item .head .st { flex: 1; font-size: 14px; }
  .item .head .st b { display: block; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 14px; padding: 6px 10px; border-radius: 16px; border: 1px solid #06c755; color: #06c755; background: #fff; cursor: pointer; }
  .chip.on { background: #06c755; color: #fff; }
  .tagadd { display: flex; gap: 8px; margin-top: 6px; }
  .tagadd input { flex: 1; }
</style>
</head>
<body>
<h1>名刺登録</h1>

<div class="card" id="start">
  <div class="row2">
    <label class="pick">撮る<input type="file" id="shoot" accept="image/*" capture="environment"></label>
    <label class="pick sub">写真から選ぶ<input type="file" id="choose" accept="image/*" multiple></label>
  </div>
  <p class="hint">無地の机の上で、明るいところで撮ってください。名刺を何枚か並べて1枚の写真に撮っても、まとめて登録できます。「写真から選ぶ」ではスクリーンショットや写真を何枚でも選べます。</p>
  <div id="startMsg" class="msg"></div>
</div>

<div class="card" id="crop">
  <h2 id="cropTitle">名刺を囲む</h2>
  <p class="hint">名刺が2枚以上写っているときは、1枚ずつ指でなぞって四角で囲んでください。囲まなければ、写真全体を1枚の名刺として読みます。</p>
  <canvas id="canvas"></canvas>
  <div class="row2">
    <button id="undo" class="sub">囲みを1つ消す</button>
    <button id="skip" class="sub">この写真を使わない</button>
  </div>
  <button id="cropGo">読み取る</button>
</div>

<div class="card" id="batch">
  <h2 id="batchTitle">読み取った名刺</h2>
  <p class="hint">読み取った内容を確かめて、違うところは直してください。</p>
  <div id="items"></div>
  <label>登録者（あなたの名前・次回から自動で入ります）</label><input id="registrant">
  <label>タグ（ここで選んだタグは、今回の名刺すべてに付きます）</label>
  <div class="chips" id="tagChips"></div>
  <div class="tagadd"><input id="tagInput" placeholder="新しいタグ（例：EO）"><button id="tagAdd" class="small">追加</button></div>
  <label>メモ（どこで会ったか など。今回の名刺すべてに入ります）</label><textarea id="memo" rows="2"></textarea>
  <button id="save">まとめて登録</button>
  <button id="more" class="sub">名刺を追加で撮る・選ぶ</button>
  <div id="saveMsg" class="msg"></div>
</div>

<script>
// 名刺登録アプリ（GAS）の公開URL。読み取り・登録・判定はすべて GAS 側で行う
const API = 'https://script.google.com/macros/s/AKfycbzNDDdytImFEXa5ZcIUDwf7BwzDv8qXz19p8DdpiQOQBzX36LhyEJwBfzghQz8bPfPglA/exec';
// text/plain で送ると事前確認（CORS）が起きない。Cookie は送らない（ログイン状態に左右されない）
async function call(body) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(body), credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
const F = [['company', '会社名'], ['title', '部署・役職'], ['name', '氏名'], ['email', 'メール', 'email'], ['tel', '電話', 'tel'],
  ['mobile', '携帯', 'tel'], ['address', '住所'], ['url', 'URL']];
const $ = id => document.getElementById(id);
function show(el, text, cls) { el.textContent = text; el.className = 'msg ' + cls; el.style.display = 'block'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- 写真を受け取って、名刺ごとに囲む ---------- */
const photos = [];   // まだ囲んでいない写真
let img = null, boxes = [], drag = null;

function onFiles(list) {
  [...list].forEach(f => photos.push(f));
  if (!img) nextPhoto();
}
$('shoot').addEventListener('change', e => { onFiles(e.target.files); e.target.value = ''; });
$('choose').addEventListener('change', e => { onFiles(e.target.files); e.target.value = ''; });

function nextPhoto() {
  const file = photos.shift();
  img = null; boxes = [];
  if (!file) { $('crop').style.display = 'none'; $('start').style.display = items.length ? 'none' : 'block'; return; }
  const im = new Image();
  im.onload = () => {
    img = im;
    const c = $('canvas');
    const s = Math.min(1, 1200 / Math.max(im.width, im.height));
    c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    $('start').style.display = 'none';
    $('crop').style.display = 'block';
    $('cropTitle').textContent = photos.length ? '名刺を囲む（残りの写真 ' + photos.length + '枚）' : '名刺を囲む';
    draw();
    $('crop').scrollIntoView({ behavior: 'smooth' });
  };
  im.onerror = () => { show($('startMsg'), '写真を開けませんでした：' + file.name, 'err'); nextPhoto(); };
  im.src = URL.createObjectURL(file);
}

function draw() {
  const c = $('canvas'), g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  const all = drag ? boxes.concat([norm(drag)]) : boxes;
  g.lineWidth = Math.max(3, c.width / 200);
  g.font = 'bold ' + Math.round(c.width / 18) + 'px sans-serif';
  all.forEach((b, i) => {
    const x = b.x * c.width, y = b.y * c.height, w = b.w * c.width, h = b.h * c.height;
    g.fillStyle = 'rgba(6,199,85,.15)'; g.fillRect(x, y, w, h);
    g.strokeStyle = '#06c755'; g.strokeRect(x, y, w, h);
    g.fillStyle = '#06c755'; g.fillText(String(i + 1), x + 8, y + c.width / 18);
  });
  $('cropGo').textContent = boxes.length ? '囲んだ ' + boxes.length + '枚を読み取る' : '写真全体を1枚として読み取る';
  $('undo').disabled = !boxes.length;
}
// 指の位置を写真の中の割合（0〜1）で持つ
function pos(e) {
  const r = $('canvas').getBoundingClientRect();
  return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
}
function norm(d) {
  return { x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1), w: Math.abs(d.x1 - d.x0), h: Math.abs(d.y1 - d.y0) };
}
$('canvas').addEventListener('pointerdown', e => {
  if (!img) return;
  const p = pos(e); drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
  $('canvas').setPointerCapture(e.pointerId);
});
$('canvas').addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pos(e); drag.x1 = p.x; drag.y1 = p.y; draw();
});
$('canvas').addEventListener('pointerup', () => {
  if (!drag) return;
  const b = norm(drag); drag = null;
  if (b.w > 0.05 && b.h > 0.05) boxes.push(b);   // 小さすぎるのは指が触れただけとみなす
  draw();
});
$('undo').addEventListener('click', () => { boxes.pop(); draw(); });
$('skip').addEventListener('click', nextPhoto);

// 囲んだところを元の写真から切り出し、長辺1600pxまでに縮めて JPEG にする
function cut(b) {
  const sx = b.x * img.width, sy = b.y * img.height, sw = b.w * img.width, sh = b.h * img.height;
  const s = Math.min(1, 1600 / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9);
}
$('cropGo').addEventListener('click', () => {
  const list = boxes.length ? boxes : [{ x: 0, y: 0, w: 1, h: 1 }];
  list.forEach(b => addItem(cut(b)));
  nextPhoto();
});

/* ---------- 読み取り（2枚ずつ同時に） ---------- */
const items = [];
let running = 0;
function addItem(dataUrl) {
  const it = { id: 'it' + Date.now() + Math.random().toString(36).slice(2, 6), dataUrl, state: 'wait', data: null };
  items.push(it);
  const el = document.createElement('div');
  el.className = 'item'; el.id = it.id;
  el.innerHTML = '<div class="head"><img src="' + it.dataUrl + '"><div class="st"><b>名刺 ' + items.length + '</b><span>読み取りを待っています…</span></div>' +
    '<button class="small sub">外す</button></div><div class="fields"></div>';
  el.querySelector('button').addEventListener('click', () => removeItem(it));
  $('items').appendChild(el);
  $('batch').style.display = 'block';
  refresh();
  pump();
}
function pump() {
  while (running < 2) {
    const it = items.find(x => x.state === 'wait');
    if (!it) break;
    it.state = 'reading'; running++;
    status(it, '読み取り中です（10秒ほど）…');
    call({ action: 'read', base64: it.dataUrl.split(',')[1], mimeType: 'image/jpeg' })
      .then(r => { it.data = r; it.state = 'ready'; status(it, ''); fillFields(it); })
      .catch(err => { it.state = 'error'; status(it, '読み取れませんでした：' + err.message + '（外してから撮り直してください）'); })
      .finally(() => { running--; refresh(); pump(); });
  }
}
function status(it, text) { const s = document.querySelector('#' + it.id + ' .st span'); if (s) s.textContent = text; }
function fillFields(it) {
  const box = document.querySelector('#' + it.id + ' .fields');
  box.innerHTML = F.map(([k, label, type]) =>
    '<label>' + label + '</label><input data-k="' + k + '"' + (type ? ' type="' + type + '"' : '') + ' value="' + esc(it.data[k] || '') + '">').join('');
  const head = document.querySelector('#' + it.id + ' .st b');
  head.textContent = it.data.name || it.data.company || head.textContent;
}
function removeItem(it) {
  if (it.state === 'reading') return;
  items.splice(items.indexOf(it), 1);
  document.getElementById(it.id).remove();
  refresh();
}
function refresh() {
  const ready = items.filter(x => x.state === 'ready').length;
  const busy = items.filter(x => x.state === 'wait' || x.state === 'reading').length;
  $('batchTitle').textContent = '読み取った名刺（' + items.length + '枚）';
  $('save').textContent = busy ? '読み取り中です（あと' + busy + '枚）' : 'まとめて登録（' + ready + '件）';
  $('save').disabled = !!busy || !ready;
  if (!items.length && !img) { $('batch').style.display = 'none'; $('start').style.display = 'block'; }
  try { if (!$('registrant').value) $('registrant').value = localStorage.getItem('meishiRegistrant') || ''; } catch (e) {}
}
$('more').addEventListener('click', () => { $('start').style.display = 'block'; $('start').scrollIntoView({ behavior: 'smooth' }); });

/* ---------- タグ（Eight のように登録時に付ける） ---------- */
const tags = new Set();
let known = [];
function drawTags() {
  const all = [...new Set([...tags, ...known])];
  $('tagChips').innerHTML = all.map(t => '<span class="chip' + (tags.has(t) ? ' on' : '') + '">' + esc(t) + '</span>').join('');
  [...$('tagChips').children].forEach((el, i) => el.addEventListener('click', () => {
    const t = all[i]; tags.has(t) ? tags.delete(t) : tags.add(t); drawTags();
  }));
}
function addTag() {
  const t = $('tagInput').value.trim().replace(/[、,，]/g, '');
  if (t) { tags.add(t); $('tagInput').value = ''; drawTags(); }
}
$('tagAdd').addEventListener('click', addTag);
$('tagInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } });
call({ action: 'tags' }).then(t => { known = t || []; drawTags(); }).catch(() => {});

/* ---------- まとめて登録（1件ずつ順に送る。失敗したものは画面に残す） ---------- */
$('save').addEventListener('click', async () => {
  addTag();
  const registrant = $('registrant').value.trim();
  try { localStorage.setItem('meishiRegistrant', registrant); } catch (e) {}
  const todo = items.filter(x => x.state === 'ready');
  $('save').disabled = true; $('more').disabled = true;
  let ok = 0, ng = 0;
  for (const it of todo) {
    const card = Object.assign({}, it.data, { registrant, memo: $('memo').value.trim(), tags: [...tags] });
    document.querySelectorAll('#' + it.id + ' [data-k]').forEach(el => { card[el.dataset.k] = el.value.trim(); });
    show($('saveMsg'), '登録中です（' + (ok + ng + 1) + '／' + todo.length + '）…', 'ok');
    try {
      await call({ action: 'save', card });
      ok++;
      items.splice(items.indexOf(it), 1);
      document.getElementById(it.id).remove();
    } catch (err) {
      ng++;
      status(it, '登録できませんでした：' + err.message);
    }
  }
  $('more').disabled = false;
  refresh();
  if (ng) {
    show($('saveMsg'), ok + '件を登録しました。' + ng + '件は登録できませんでした（画面に残しています）。', 'err');
  } else {
    $('memo').value = '';
    tags.forEach(t => { if (!known.includes(t)) known.unshift(t); });
    tags.clear(); drawTags();
    $('saveMsg').style.display = 'none';
    show($('startMsg'), ok + '件を登録しました（提案余地商材は数分でスプシに入ります）。次の名刺を撮れます。', 'ok');
  }
});
</script>
</body>
</html>
