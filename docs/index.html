<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名刺登録</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #222; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hint { font-size: 13px; color: #666; margin: 6px 0 0; }
  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  button, .pick { display: block; width: 100%; box-sizing: border-box; text-align: center; font-size: 17px; padding: 14px; border: 0; border-radius: 10px; background: #06c755; color: #fff; font-weight: bold; margin-top: 12px; cursor: pointer; }
  button.sub, .pick.sub { background: #e5e7eb; color: #222; }
  button.small { display: inline-block; width: auto; font-size: 14px; padding: 8px 12px; margin: 0; }
  button:disabled { opacity: .5; }
  .pick input { display: none; }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .msg { padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
  .ok { background: #e7f7ee; color: #116b35; }
  .err { background: #fdecec; color: #a12121; }
  #batch { display: none; }
  .item { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-top: 12px; }
  .item.done { opacity: .5; }
  .item .head { display: flex; align-items: center; gap: 10px; }
  .item .head img { width: 45%; border-radius: 6px; }
  .item .head .st { flex: 1; font-size: 14px; }
  .item .head .st b { display: block; font-size: 15px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .quick span { font-size: 14px; padding: 5px 10px; border-radius: 14px; border: 1px solid #06c755; color: #06c755; cursor: pointer; }
  .quick span.on { background: #06c755; color: #fff; }
</style>
</head>
<body>
<h1>名刺登録</h1>

<div class="card" id="start">
  <div class="row2">
    <label class="pick">撮る<input type="file" id="shoot" accept="image/*" capture="environment"></label>
    <label class="pick sub">写真から選ぶ<input type="file" id="choose" accept="image/*" multiple></label>
  </div>
  <p class="hint"><b>名刺どうしを少し離して並べ、1回10枚までで撮ってください。</b>写真に写った名刺を自動で1枚ずつ読み取ります。</p>
  <div id="startMsg" class="msg"></div>
</div>

<div class="card" id="batch">
  <h2 id="batchTitle">読み取った名刺</h2>
  <p class="hint">読み取った内容を確かめて、違うところは直してください。</p>
  <div id="items"></div>
  <label>登録者（あなたの名前・次回から自動で入ります）</label><input id="registrant">
  <datalist id="tagList"></datalist>
  <label>メモ（どこで会ったか など。今回の名刺すべてに入ります）</label><textarea id="memo" rows="2"></textarea>
  <button id="save">まとめて登録</button>
  <div id="saveMsg" class="msg"></div>
</div>

<script>
// 名刺登録アプリ（GAS）の公開URL。読み取り・登録・判定はすべて GAS 側で行う
const API = 'https://script.google.com/macros/s/AKfycbzNDDdytImFEXa5ZcIUDwf7BwzDv8qXz19p8DdpiQOQBzX36LhyEJwBfzghQz8bPfPglA/exec';
// text/plain で送ると事前確認（CORS）が起きない。Cookie は送らない（ログイン状態に左右されない）
async function call(body) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(body), credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
const F = [['company', '会社名'], ['title', '部署・役職'], ['name', '氏名'], ['email', 'メール', 'email'], ['tel', '電話', 'tel'],
  ['mobile', '携帯', 'tel'], ['address', '住所'], ['url', 'URL']];
const $ = id => document.getElementById(id);
function show(el, text, cls) { el.textContent = text; el.className = 'msg ' + cls; el.style.display = 'block'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- 写真を受け取って、写っている名刺を自動で1枚ずつに分ける ---------- */
$('shoot').addEventListener('change', e => { onFiles(e.target.files); e.target.value = ''; });
$('choose').addEventListener('change', e => { onFiles(e.target.files); e.target.value = ''; });

async function onFiles(list) {
  let n = 0;
  const bad = [];
  for (const file of [...list]) {
    try {
      const im = await loadImage(file);
      const boxes = detectCards(im);
      boxes.forEach(b => addItem(cut(im, b)));
      n += boxes.length;
    } catch (e) {
      bad.push(file.name);
    }
  }
  if (bad.length) show($('startMsg'), '開けなかった写真があります：' + bad.join('、'), 'err');
  else show($('startMsg'), '名刺を' + n + '枚見つけました。下で読み取った内容を確かめて登録してください。', 'ok');
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = URL.createObjectURL(file);
  });
}

/**
 * 写真の中の名刺を探す（AI は使わない。画面の中だけで計算する）
 * 2つの見方で探し、どちらかで見つかったものを合わせて使う（同じ名刺は1つにまとめる）。
 *   色：写真の縁の色を「机の色」とみなし、それと色の違うかたまり（色の違う机の上の名刺に強い）
 *   線：名刺のふち・影の線で囲まれたところ（白い机の白い名刺、黒い机の暗い名刺に強い）
 * 2枚以上見つからなければ、写真全体（または見つかった1枚）を1枚の名刺として読む。
 */
function detectCards(im) {
  const S = 600 / Math.max(im.width, im.height);
  const W = Math.max(1, Math.round(im.width * S)), H = Math.max(1, Math.round(im.height * S)), N = W * H;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(im, 0, 0, W, H);
  const px = g.getImageData(0, 0, W, H).data;
  const a = [byColor(px, W, H), byLines(px, W, H)].map(mask => cardBoxes(mask, W, H));
  const found = a[0].length >= a[1].length ? a[0].slice() : a[1].slice();
  const overlap = (p, q) => {
    const ix = Math.max(0, Math.min(p.x + p.w, q.x + q.w) - Math.max(p.x, q.x));
    const iy = Math.max(0, Math.min(p.y + p.h, q.y + q.h) - Math.max(p.y, q.y));
    return ix * iy / Math.min(p.w * p.h, q.w * q.h);
  };
  a[0].concat(a[1]).forEach(b => { if (!found.some(f => overlap(f, b) > 0.3)) found.push(b); });
  const sum = found.reduce((t, b) => t + b.a, 0);
  if (found.length >= 2 && sum >= N * 0.1) {
    // 上の段から、左から順に並べる
    found.sort((p, q) => (Math.abs(p.y - q.y) < Math.min(p.h, q.h) / 2 ? p.x - q.x : p.y - q.y));
    return found.map(pad);
  }
  if (found.length === 1 && found[0].a >= N * 0.2) return [pad(found[0])];
  return [{ x: 0, y: 0, w: 1, h: 1 }];
}
// 色：机の色（縁3%の中央値）から離れた色のところを1にする
function byColor(px, W, H) {
  const m = Math.max(2, Math.round(Math.min(W, H) * 0.03));
  const edge = [[], [], []];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (x >= m && y >= m && x < W - m && y < H - m) continue;
    const i = (y * W + x) * 4; edge[0].push(px[i]); edge[1].push(px[i + 1]); edge[2].push(px[i + 2]);
  }
  const bg = edge.map(v => v.slice().sort((p, q) => p - q)[v.length >> 1]);
  const ed = edge[0].map((_, k) => Math.abs(edge[0][k] - bg[0]) + Math.abs(edge[1][k] - bg[1]) + Math.abs(edge[2][k] - bg[2])).sort((p, q) => p - q);
  const T = Math.max(60, ed[Math.floor(ed.length * 0.9)] * 1.5);   // 机の模様・影より大きい差だけ
  const fg = new Uint8Array(W * H);
  for (let k = 0; k < W * H; k++) {
    const i = k * 4;
    fg[k] = Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) > T ? 1 : 0;
  }
  return fg;
}
// 線：明るさの変わり目（ふち・影）を線として拾い、写真の外側から塗っていって、線に囲まれて塗れなかったところを1にする
function byLines(px, W, H) {
  const N = W * H, gray = new Float32Array(N), bl = new Float32Array(N), gr = new Float32Array(N);
  for (let k = 0; k < N; k++) gray[k] = px[k * 4] * 0.3 + px[k * 4 + 1] * 0.59 + px[k * 4 + 2] * 0.11;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {   // ざらつきを均す
    let t = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) t += gray[(y + dy) * W + x + dx];
    bl[y * W + x] = t / 9;
  }
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    const k = y * W + x;
    gr[k] = Math.abs(bl[k + 1] - bl[k - 1]) + Math.abs(bl[k + W] - bl[k - W]);
  }
  const sorted = Array.from(gr).filter(v => v > 0).sort((p, q) => p - q);
  const T = Math.max(6, (sorted[sorted.length >> 1] || 0) * 3);   // 写真全体のざらつきの3倍より強い変わり目だけ
  let line = new Uint8Array(N);
  for (let k = 0; k < N; k++) line[k] = gr[k] > T ? 1 : 0;
  line = grow(line, W, H, 1);   // 途切れた線をつなぐ
  // 写真の外側から、線を越えずに塗る
  const out = new Uint8Array(N), st = new Int32Array(N);
  let top = 0;
  const push = k => { if (!out[k] && !line[k]) { out[k] = 1; st[top++] = k; } };
  for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
  while (top) {
    const q = st[--top], x = q % W;
    if (x > 0) push(q - 1); if (x < W - 1) push(q + 1); if (q >= W) push(q - W); if (q < N - W) push(q + W);
  }
  const fg = new Uint8Array(N);
  for (let k = 0; k < N; k++) fg[k] = out[k] ? 0 : 1;
  return fg;
}
// 1のところを r だけ太らせる
function grow(m, W, H, r) {
  const o = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!m[y * W + x]) continue;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const yy = y + dy, xx = x + dx;
      if (yy >= 0 && yy < H && xx >= 0 && xx < W) o[yy * W + xx] = 1;
    }
  }
  return o;
}
// かたまりのうち名刺らしいものの外枠を返す
function cardBoxes(fg, W, H) {
  // 少し削って、近くに置いた名刺どうし・机の細かい線を切り離す
  const R = 3, er = new Uint8Array(W * H);
  for (let y = R; y < H - R; y++) for (let x = R; x < W - R; x++) {
    let ok = 1;
    for (let dy = -R; dy <= R && ok; dy++) for (let dx = -R; dx <= R; dx++) if (!fg[(y + dy) * W + x + dx]) { ok = 0; break; }
    er[y * W + x] = ok;
  }
  const seen = new Uint8Array(W * H), st = new Int32Array(W * H), found = [];
  for (let k = 0; k < W * H; k++) {
    if (!er[k] || seen[k]) continue;
    let top = 0, n = 0, x0 = W, y0 = H, x1 = 0, y1 = 0;
    st[top++] = k; seen[k] = 1;
    while (top) {
      const q = st[--top], x = q % W, y = (q - x) / W; n++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && er[q - 1] && !seen[q - 1]) { seen[q - 1] = 1; st[top++] = q - 1; }
      if (x < W - 1 && er[q + 1] && !seen[q + 1]) { seen[q + 1] = 1; st[top++] = q + 1; }
      if (y > 0 && er[q - W] && !seen[q - W]) { seen[q - W] = 1; st[top++] = q - W; }
      if (y < H - 1 && er[q + W] && !seen[q + W]) { seen[q + W] = 1; st[top++] = q + W; }
    }
    const bw = x1 - x0 + 1 + 2 * R, bh = y1 - y0 + 1 + 2 * R, area = bw * bh;
    const ratio = Math.max(bw, bh) / Math.min(bw, bh);
    // 名刺らしさ：写真の1.5%以上・写真の9割未満の大きさ・中身が詰まっている（文字の集まりではない）・極端に細長くない
    if (area >= W * H * 0.015 && area < W * H * 0.9 && n / area >= 0.4 && ratio <= 2.3)
      found.push({ x: (x0 - R) / W, y: (y0 - R) / H, w: bw / W, h: bh / H, a: area });
  }
  // 1枚の写真の名刺はだいたい同じ大きさ。一番大きいものの35%未満（ロゴ・小物）は外す
  const big = Math.max(0, ...found.map(b => b.a));
  return found.filter(b => b.a >= big * 0.35);
}
// 名刺の縁が欠けないように、少し外側まで含める
function pad(b) {
  const p = 0.015, x = Math.max(0, b.x - p), y = Math.max(0, b.y - p);
  return { x, y, w: Math.min(1, b.x + b.w + p) - x, h: Math.min(1, b.y + b.h + p) - y };
}
// 見つけた範囲を元の写真から切り出し、長辺1600pxまでに縮めて JPEG にする
function cut(im, b) {
  const sx = b.x * im.width, sy = b.y * im.height, sw = b.w * im.width, sh = b.h * im.height;
  const s = Math.min(1, 1600 / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  c.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9);
}

/* ---------- 読み取り（2枚ずつ同時に） ---------- */
const items = [];
let running = 0;
function addItem(dataUrl) {
  const it = { id: 'it' + Date.now() + Math.random().toString(36).slice(2, 6), dataUrl, state: 'wait', data: null };
  items.push(it);
  const el = document.createElement('div');
  el.className = 'item'; el.id = it.id;
  el.innerHTML = '<div class="head"><img src="' + it.dataUrl + '"><div class="st"><b>名刺 ' + items.length + '</b><span>読み取りを待っています…</span></div>' +
    '<button class="small sub">外す</button></div><div class="fields"></div>';
  el.querySelector('button').addEventListener('click', () => removeItem(it));
  $('items').appendChild(el);
  $('batch').style.display = 'block';
  refresh();
  pump();
}
function pump() {
  while (running < 2) {
    const it = items.find(x => x.state === 'wait');
    if (!it) break;
    it.state = 'reading'; running++;
    status(it, '読み取り中です（10秒ほど）…');
    call({ action: 'read', base64: it.dataUrl.split(',')[1], mimeType: 'image/jpeg' })
      .then(r => {
        it.data = r; it.state = 'ready'; fillFields(it);
        // メールが2つ以上読めたときは、2枚以上が1枚として読まれている
        const mails = new Set((r.rawText || '').match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g) || []);
        status(it, mails.size >= 2 ? '名刺が2枚以上まとめて読まれたようです。外してから、名刺と色の違う机の上で撮り直してください。' : '');
      })
      .catch(err => { it.state = 'error'; status(it, '読み取れませんでした：' + err.message + '（外してから撮り直してください）'); })
      .finally(() => { running--; refresh(); pump(); });
  }
}
function status(it, text) { const s = document.querySelector('#' + it.id + ' .st span'); if (s) s.textContent = text; }
function fillFields(it) {
  const box = document.querySelector('#' + it.id + ' .fields');
  box.innerHTML = F.map(([k, label, type]) =>
    '<label>' + label + '</label><input data-k="' + k + '"' + (type ? ' type="' + type + '"' : '') + ' value="' + esc(it.data[k] || '') + '">').join('') +
    '<label>タグ（例：EO。2つ以上は「、」で区切る）</label><input class="tag" list="tagList" autocomplete="off"><div class="quick"></div>';
  const tag = box.querySelector('.tag');
  tag.addEventListener('input', () => drawQuick(it));
  tag.addEventListener('change', () => { learn(tagsOf(it)); });
  drawQuick(it);
  const head = document.querySelector('#' + it.id + ' .st b');
  head.textContent = it.data.name || it.data.company || head.textContent;
}
function removeItem(it) {
  if (it.state === 'reading') return;
  items.splice(items.indexOf(it), 1);
  document.getElementById(it.id).remove();
  refresh();
}
function refresh() {
  const ready = items.filter(x => x.state === 'ready').length;
  const busy = items.filter(x => x.state === 'wait' || x.state === 'reading').length;
  $('batchTitle').textContent = '読み取った名刺（' + items.length + '枚）';
  $('save').textContent = busy ? '読み取り中です（あと' + busy + '枚）' : 'まとめて登録（' + ready + '件）';
  $('save').disabled = !!busy || !ready;
  if (!items.length) $('batch').style.display = 'none';
  try { if (!$('registrant').value) $('registrant').value = localStorage.getItem('meishiRegistrant') || ''; } catch (e) {}
}

/* ---------- タグ：名刺ごとに書く。前に使ったタグはボタンで選べる ---------- */
let known = [];
const splitTags = v => v.split(/[、,，]/).map(t => t.trim()).filter(Boolean);
const tagsOf = it => { const el = document.querySelector('#' + it.id + ' .tag'); return el ? splitTags(el.value) : []; };
function drawQuick(it) {
  const box = document.querySelector('#' + it.id + ' .quick');
  if (!box) return;
  const on = tagsOf(it);
  box.innerHTML = known.slice(0, 8).map(t => '<span class="' + (on.includes(t) ? 'on' : '') + '">' + esc(t) + '</span>').join('');
  [...box.children].forEach((el, i) => el.addEventListener('click', () => {
    const t = known[i], cur = tagsOf(it);
    document.querySelector('#' + it.id + ' .tag').value = (cur.includes(t) ? cur.filter(x => x !== t) : cur.concat(t)).join('、');
    drawQuick(it);
  }));
}
// 新しく書いたタグを、ほかの名刺のボタンにも出す
function learn(list) {
  list.forEach(t => { if (!known.includes(t)) known.unshift(t); });
  $('tagList').innerHTML = known.map(t => '<option value="' + esc(t) + '">').join('');
  items.forEach(drawQuick);
}
call({ action: 'tags' }).then(t => { known = t || []; learn([]); }).catch(() => {});

/* ---------- まとめて登録（1件ずつ順に送る。失敗したものは画面に残す） ---------- */
$('save').addEventListener('click', async () => {
  const registrant = $('registrant').value.trim();
  try { localStorage.setItem('meishiRegistrant', registrant); } catch (e) {}
  const todo = items.filter(x => x.state === 'ready');
  $('save').disabled = true;
  let ok = 0, ng = 0;
  for (const it of todo) {
    const card = Object.assign({}, it.data, { registrant, memo: $('memo').value.trim(), tags: tagsOf(it) });
    document.querySelectorAll('#' + it.id + ' [data-k]').forEach(el => { card[el.dataset.k] = el.value.trim(); });
    show($('saveMsg'), '登録中です（' + (ok + ng + 1) + '／' + todo.length + '）…', 'ok');
    try {
      await call({ action: 'save', card });
      ok++;
      items.splice(items.indexOf(it), 1);
      document.getElementById(it.id).remove();
    } catch (err) {
      ng++;
      status(it, '登録できませんでした：' + err.message);
    }
  }
  refresh();
  if (ng) {
    show($('saveMsg'), ok + '件を登録しました。' + ng + '件は登録できませんでした（画面に残しています）。', 'err');
  } else {
    $('memo').value = '';
    $('saveMsg').style.display = 'none';
    show($('startMsg'), ok + '件を登録しました（提案余地商材は数分でスプシに入ります）。次の名刺を撮れます。', 'ok');
  }
});
</script>
</body>
</html>
